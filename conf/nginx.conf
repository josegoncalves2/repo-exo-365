# ===================================================================
# Proxy reverso do eXo Platform + ONLYOFFICE
#
# Base: conf/nginx.conf oficial de github.com/exo-docker/exo-community
# As rotas (regex de /doc/, /coauthoring, /websocket etc.) são mantidas
# IDÊNTICAS ao upstream — são elas que fazem a edição colaborativa
# funcionar. Alterações são ADITIVAS apenas:
#   + timeouts longos (eXo faz requisições demoradas; cometd é long-poll)
#   + buffers maiores (cabeçalhos grandes de sessão do eXo)
#   + repasse de X-Forwarded-Proto/Host
#   + endpoint /nginx-health para healthcheck
# ===================================================================

user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
  include               mime.types;
  default_type          application/octet-stream;
  server_tokens         off;

  sendfile              on;
  tcp_nopush            on;
  keepalive_timeout     120s;

  # Cabeçalhos de sessão do eXo são grandes
  proxy_buffer_size     16k;
  proxy_buffers         8 16k;
  proxy_busy_buffers_size 32k;
  large_client_header_buffers 4 32k;

  # O eXo devolve respostas grandes (bundles de JS/CSS, downloads de anexo).
  # Quando a resposta não cabe nos buffers acima, o nginx a grava em arquivo
  # temporário e registra, a cada ocorrência:
  #   [warn] an upstream response is buffered to a temporary file
  #          /var/cache/nginx/proxy_temp/... while reading upstream
  # Com o limite em 0 o nginx nunca usa arquivo temporário: repassa a
  # resposta ao cliente conforme lê do backend. Além de eliminar o aviso,
  # reduz latência e escrita em disco. O custo é manter a conexão com o
  # backend ocupada enquanto o cliente lê — irrelevante em rede local.
  proxy_max_temp_file_size 0;

  # eXo pode demorar em operações de indexação/conversão de documento
  proxy_connect_timeout 120s;
  proxy_send_timeout    600s;
  proxy_read_timeout    600s;

  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time uct=$upstream_connect_time '
                    'urt=$upstream_response_time';
  access_log            /var/log/nginx/access.log main;
  error_log             /var/log/nginx/error.log warn;

  gzip                  on;
  gzip_proxied          any;
  gzip_http_version     1.1;
  gzip_comp_level       6;
  gzip_types            text/plain text/css text/javascript application/json application/x-javascript text/xml application/xml application/xml+rss;
  gzip_disable          msie6;

  map $http_host $this_host {
    "" $host;
    default $http_host;
  }
  map $http_x_forwarded_proto $the_scheme {
    default $http_x_forwarded_proto;
    "" $scheme;
  }
  map $http_x_forwarded_host $the_host {
    default $http_x_forwarded_host;
    "" $this_host;
  }
  map $http_upgrade $proxy_connection {
    default upgrade;
    "" close;
  }

  # ATENCAO: sem underscore no nome. Se algum location deixar de definir
  # "Host", o nginx usa o nome do upstream como Host, e o Tomcat 10 devolve
  # 400 Bad Request para hostnames com underscore (violacao de RFC 952/1123).
  upstream  exoapp {
    server  exo:8080;
    keepalive 32;
  }

  server {
    listen 80 default_server;
    # IPv6 tambem: o wget do healthcheck resolve "localhost" para ::1 primeiro,
    # e sem este listen o proprio proxy era reportado como doente (connection
    # refused em ::1) mesmo servindo normalmente em IPv4.
    listen [::]:80 default_server;

    # TLS do portal (2026-08-20). MESMO server block da 80: todas as
    # location abaixo passam a responder em https://192.168.1.59/ tambem,
    # sem duplicar nenhuma rota. $the_scheme (mapeado no topo do arquivo a
    # partir de $http_x_forwarded_proto, com fallback pra $scheme) ja'
    # reflete "https" sozinho quando o TLS termina aqui -- nenhuma outra
    # mudanca de config precisou ser feita pras rotas existentes.
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_certificate     /etc/nginx/portal-certs/portal-fullchain.pem;
    ssl_certificate_key /etc/nginx/portal-certs/portal-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Repasse das informações do cliente para o backend
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header Host               $host;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $the_scheme;
    proxy_set_header X-Forwarded-Host   $the_host;

    client_max_body_size 0;

    # =================================================================
    # Matrix / Synapse — API do chat, consumida pelo navegador do usuário
    # Precisa passar pelo proxy porque o cliente de chat roda no browser
    # e só enxerga a porta 80. Corpo grande para envio de anexos.
    # =================================================================
    location /_matrix {
      proxy_pass http://synapse:8008;
      proxy_http_version 1.1;
      proxy_set_header Host               $host;
      proxy_set_header X-Real-IP          $remote_addr;
      proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto  $the_scheme;
      proxy_set_header Upgrade            $http_upgrade;
      proxy_set_header Connection         $proxy_connection;
      client_max_body_size 100M;
      proxy_read_timeout 3600s;
    }
    location /_synapse/client {
      proxy_pass http://synapse:8008;
      proxy_http_version 1.1;
      proxy_set_header Host               $host;
      proxy_set_header X-Real-IP          $remote_addr;
      proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto  $the_scheme;
    }

    # =================================================================
    # RAIZ DO SITE — correção de defeito de usuário final
    # O webapp ROOT do eXo 7.2 é o WebDAV: pedir "/" devolve
    # 302 -> /webdav/drives -> 401, ou seja, quem digita
    # http://192.168.1.59/ recebe uma caixa de autenticação WebDAV
    # em vez do portal. Verificado direto no Tomcat, sem o proxy:
    #   docker exec exo-app curl -D- http://localhost:8080/
    #   HTTP/1.1 302  Location: /webdav/drives
    # O redirecionamento é feito aqui, no ponto de entrada. "location = /"
    # é correspondência EXATA e tem precedência sobre todos os regex,
    # portanto intercepta apenas a raiz e não afeta nenhuma outra rota
    # (/webdav continua acessível para clientes WebDAV reais).
    # =================================================================
    location = / {
      return 302 /portal/;
    }

    # --- Healthcheck do próprio proxy (adicionado) ---
    location = /nginx-health {
      access_log off;
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }

    # Serve small shim JS files locally to avoid noisy 404s from the
    # application when certain legacy paths are requested.
    location ^~ /js/ {
      root /usr/share/nginx/html;
      access_log off;
      add_header Content-Type application/javascript;
    }

    # =================================================================
    # ONLYOFFICE DocumentServer — rotas idênticas ao upstream
    # =================================================================
    location ~ ((/websocket)|(\/[\d]+\.[\d]+\.[\d]+[\.|-][\d]+(.+)\/websocket)|^(\/[\d]+\.[\d]+\.[\d]+[\.|-].+)?(\/doc\/.*)) {
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $the_host;
      proxy_set_header X-Forwarded-Proto $the_scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_http_version 1.1;
      proxy_pass http://onlyoffice$1$2$is_args$args;
    }
    location ~ ^(\/[\d]+\.[\d]+\.[\d]+[\.|-].+)/ {
      proxy_pass http://onlyoffice;
    }
    location ~ ^/OfficeWeb {
      proxy_pass http://onlyoffice;
    }
    location ~ ^/downloadfile {
      proxy_pass http://onlyoffice;
    }
    location ~ ^/converter {
      proxy_pass http://onlyoffice;
    }
    location ~ ^/printfile {
      proxy_pass http://onlyoffice;
    }
    location ~ ^/cache {
      proxy_pass http://onlyoffice;
    }
    location ~ ^/web-apps {
      proxy_pass http://onlyoffice;
    }
    location ~ ^/healthcheck {
      proxy_pass http://onlyoffice;
    }
    location ~ ^/coauthoring {
      add_header X-Frame-Options SAMEORIGIN always;
      proxy_pass http://onlyoffice;
    }
    # Websocket da edição colaborativa ao vivo
    # (mesma regra de heranca: repetir os cabecalhos do nivel server)
    location ~ /websocket$ {
      proxy_http_version 1.1;
      proxy_set_header Upgrade            $http_upgrade;
      proxy_set_header Connection         "upgrade";
      proxy_set_header Host               $http_host;
      proxy_set_header X-Real-IP          $remote_addr;
      proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto  $the_scheme;
      proxy_set_header X-Forwarded-Host   $the_host;
      proxy_pass http://onlyoffice;
    }

    # =================================================================
    # eXo Platform
    # =================================================================
    # IMPORTANTE — regra de heranca do nginx:
    # basta UM proxy_set_header dentro de um location para que TODOS os
    # proxy_set_header herdados do nivel server sejam descartados. Por isso
    # os cabecalhos abaixo sao repetidos integralmente em cada location que
    # define qualquer header proprio. Omiti-los fez o nginx enviar
    # "Host: <nome-do-upstream>" e o Tomcat responder 400 a todas as paginas.
    location / {
        proxy_pass http://exoapp;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $the_scheme;
        proxy_set_header X-Forwarded-Host   $the_host;
    }

    # =================================================================
    # UPLOAD DE ARQUIVOS — eliminacao de warning recorrente do nginx
    #
    # SINTOMA: "[warn] a client request body is buffered to a temporary file
    # /var/cache/nginx/client_temp/NNN ... request: POST /portal/upload".
    # CAUSA: sem client_body_buffer_size explicito, o nginx usa o padrao de
    # 8k/16k. O corpo de QUALQUER upload maior que isso e' gravado em disco, e
    # o nginx registra um aviso a cada vez. Numa plataforma que substitui o
    # OneDrive/SharePoint, upload grande e' o caso de uso normal — ou seja, o
    # aviso era gerado pelo funcionamento correto do sistema.
    #
    # POR QUE proxy_request_buffering off E NAO um buffer gigante: manter o
    # corpo em memoria exigiria alocar por conexao, e este host opera com
    # folga estreita de RAM. Com o buffering de requisicao desligado o nginx
    # repassa o corpo ao Tomcat em fluxo continuo: nao ha arquivo temporario,
    # nao ha aviso, e nao ha consumo de memoria proporcional ao arquivo.
    # Contrapartida aceita: o nginx perde a capacidade de reenviar o corpo a
    # outro upstream em caso de falha. Aqui existe um unico upstream (exoapp)
    # em rede local, portanto essa capacidade nao tinha efeito pratico.
    #
    # client_body_buffer_size continua definido para o caso de o nginx
    # precisar bufferizar algo nesta rota por outro motivo.
    #
    # O prefixo ^~ garante precedencia sobre "location /" sem depender de
    # ordem. Os proxy_set_header sao repetidos integralmente de proposito —
    # ver a regra de heranca documentada acima em "location /".
    # Interface da estrutura organizacional. O ^~ garante precedencia sobre
    # "location /", que manda tudo para o eXo. A barra final no proxy_pass
    # TIRA o prefixo /estrutura/ antes de repassar -- por isso a pagina usa
    # caminhos relativos (api/log e nao /api/log).
    location = /estrutura { return 301 /estrutura/; }
    location ^~ /estrutura/ {
        proxy_pass http://172.20.0.1:878/;   # interface roda no HOST (systemd exo-estrutura.service), nao em container
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Provisionar uma arvore grande passa de um minuto; o padrao de 60s
        # cortaria a resposta no meio.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        # Imagens de avatar/banner sobem em base64 dentro do JSON.
        client_max_body_size 64m;
    }

    location ^~ /portal/upload {
        proxy_pass http://exoapp;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        client_body_buffer_size 1m;
        client_max_body_size 0;
        proxy_set_header Connection "";
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $the_scheme;
        proxy_set_header X-Forwarded-Host   $the_host;
    }

    # Websocket do Cometd (notificações e chat em tempo real)
    location /cometd/cometd {
        proxy_pass http://exoapp;
        proxy_http_version 1.1;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         "upgrade";
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $the_scheme;
        proxy_set_header X-Forwarded-Host   $the_host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
  }

  # =================================================================
  # JITSI MEET — HTTPS na porta 8443  (AUDIT [099])
  #
  # POR QUE TLS, E POR QUE OBRIGATORIO: getUserMedia() — a chamada que pede
  # camera e microfone ao navegador — so' e' liberada em SECURE CONTEXT.
  # Em http://192.168.1.59 o Chrome e o Firefox recusam a captura e a
  # videoconferencia nunca abre video. Nao e' preferencia de seguranca: sem
  # HTTPS a funcionalidade simplesmente nao existe.
  #
  # O certificado e' emitido pela CA interna que este projeto ja' mantem
  # (conf/mysql-certs, 'PMO eXo Root CA', validade ate' 2036) — a mesma
  # cadeia usada pelo MySQL. Importar a CA raiz nas estacoes elimina o aviso
  # do navegador; sem importar, o usuario aceita o aviso uma vez.
  #
  # SERVER BLOCK SEPARADO, e nao um location na porta 80, por dois motivos:
  #   1. o Jitsi Meet assume que e' servido na raiz do host; hospeda-lo sob
  #      um subcaminho exigiria reescrever /http-bind, /xmpp-websocket e os
  #      assets estaticos — fragil e sem ganho;
  #   2. isola o risco: nada aqui toca o bloco da porta 80 que serve o eXo e
  #      o ONLYOFFICE, entao esta adicao nao pode causar regressao no portal.
  server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/jitsi-certs/jitsi-fullchain.pem;
    ssl_certificate_key /etc/nginx/jitsi-certs/jitsi-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:JitsiSSL:5m;
    ssl_session_timeout 1h;

    # RESOLUCAO EM TEMPO DE REQUISICAO, DE PROPOSITO.
    # Se o backend fosse escrito como 'proxy_pass http://jitsi-web;' o nginx
    # resolveria o nome no CARREGAMENTO da configuracao e se RECUSARIA A
    # INICIAR enquanto o container do Jitsi nao existisse — ou seja, uma
    # falha do Jitsi derrubaria o PORTAL INTEIRO junto. Com a variavel abaixo
    # + resolver do Docker (127.0.0.11), o nome so' e' resolvido quando chega
    # uma requisicao: se o Jitsi estiver fora, esta porta devolve 502 e o
    # portal na porta 80 continua intacto. Por isso, tambem, o exo-web NAO
    # declara depends_on do jitsi-web no docker-compose.yml.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $jitsi_backend http://jitsi-web:80;

    # Corpo grande so' aparece em upload de avatar/gravacao; 0 = sem limite,
    # coerente com a rota de upload do portal.
    client_max_body_size 0;

    # Close pages: quando a reuniao termina, o navegador vai para
    # /close.html, /close2.html ou /close3.html (depende da versao/config).
    # Essas paginas sao montadas a partir de conf/jitsi/close-redirect.html
    # como bind mounts no jitsi-web. Mas o nginx faz proxy de tudo para
    # o Jitsi (que e' uma SPA e ignora o caminho), entao precisamos servir
    # o arquivo estatico AQUI no nginx, nao deixar ir para o jitsi-web.
    location ~ ^/close[0-9]?\.html$ {
      root /jitsi-mounts;
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      add_header Pragma "no-cache";
      add_header Expires "0";
    }

    location / {
      proxy_pass $jitsi_backend;
      proxy_http_version 1.1;
      # O Jitsi Meet e' inteiramente dependente de WEBSOCKET (sinalizacao
      # XMPP sobre /xmpp-websocket e a ponte de colibri). Sem Upgrade/
      # Connection a sala fica em "connecting..." para sempre.
      proxy_set_header Upgrade            $http_upgrade;
      proxy_set_header Connection         "upgrade";
      proxy_set_header Host               $host;
      proxy_set_header X-Real-IP          $remote_addr;
      proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
      # FIXO em https: este bloco so' atende TLS, e o cliente Jitsi usa este
      # cabecalho para montar a URL do websocket. Se chegasse 'http', o
      # navegador tentaria ws:// a partir de uma pagina https e bloquearia
      # por mixed content.
      proxy_set_header X-Forwarded-Proto  https;
      proxy_set_header X-Forwarded-Host   $host;
      # Conferencia longa nao pode cair por timeout de proxy.
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }
}

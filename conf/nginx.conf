# ===================================================================
# Proxy reverso do eXo Platform + ONLYOFFICE
#
# Base: conf/nginx.conf oficial de github.com/exo-docker/exo-community
# As rotas (regex de /doc/, /coauthoring, /websocket etc.) são mantidas
# IDÊNTICAS ao upstream — são elas que fazem a edição colaborativa
# funcionar. Alterações são ADITIVAS apenas:
#   + timeouts longos (eXo faz requisições demoradas; cometd é long-poll)
#   + buffers maiores (cabeçalhos grandes de sessão do eXo)
#   + repasse de X-Forwarded-Proto/Host
#   + endpoint /nginx-health para healthcheck
# ===================================================================

user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
  include               mime.types;
  default_type          application/octet-stream;
  server_tokens         off;

  sendfile              on;
  tcp_nopush            on;
  keepalive_timeout     120s;

  # Cabeçalhos de sessão do eXo são grandes
  proxy_buffer_size     16k;
  proxy_buffers         8 16k;
  proxy_busy_buffers_size 32k;
  large_client_header_buffers 4 32k;

  # O eXo devolve respostas grandes (bundles de JS/CSS, downloads de anexo).
  # Quando a resposta não cabe nos buffers acima, o nginx a grava em arquivo
  # temporário e registra, a cada ocorrência:
  #   [warn] an upstream response is buffered to a temporary file
  #          /var/cache/nginx/proxy_temp/... while reading upstream
  # Com o limite em 0 o nginx nunca usa arquivo temporário: repassa a
  # resposta ao cliente conforme lê do backend. Além de eliminar o aviso,
  # reduz latência e escrita em disco. O custo é manter a conexão com o
  # backend ocupada enquanto o cliente lê — irrelevante em rede local.
  proxy_max_temp_file_size 0;

  # eXo pode demorar em operações de indexação/conversão de documento
  proxy_connect_timeout 120s;
  proxy_send_timeout    600s;
  proxy_read_timeout    600s;

  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time uct=$upstream_connect_time '
                    'urt=$upstream_response_time';
  access_log            /var/log/nginx/access.log main;
  error_log             /var/log/nginx/error.log warn;

  gzip                  on;
  gzip_proxied          any;
  gzip_http_version     1.1;
  gzip_comp_level       6;
  gzip_types            text/plain text/css text/javascript application/json application/x-javascript text/xml application/xml application/xml+rss;
  gzip_disable          msie6;

  map $http_host $this_host {
    "" $host;
    default $http_host;
  }
  map $http_x_forwarded_proto $the_scheme {
    default $http_x_forwarded_proto;
    "" $scheme;
  }
  map $http_x_forwarded_host $the_host {
    default $http_x_forwarded_host;
    "" $this_host;
  }
  map $http_upgrade $proxy_connection {
    default upgrade;
    "" close;
  }

  # ATENCAO: sem underscore no nome. Se algum location deixar de definir
  # "Host", o nginx usa o nome do upstream como Host, e o Tomcat 10 devolve
  # 400 Bad Request para hostnames com underscore (violacao de RFC 952/1123).
  upstream  exoapp {
    server  exo:8080;
    keepalive 32;
  }

  server {
    listen 80 default_server;
    # IPv6 tambem: o wget do healthcheck resolve "localhost" para ::1 primeiro,
    # e sem este listen o proprio proxy era reportado como doente (connection
    # refused em ::1) mesmo servindo normalmente em IPv4.
    listen [::]:80 default_server;

    # Repasse das informações do cliente para o backend
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header Host               $host;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $the_scheme;
    proxy_set_header X-Forwarded-Host   $the_host;

    client_max_body_size 0;

    # =================================================================
    # Matrix / Synapse — API do chat, consumida pelo navegador do usuário
    # Precisa passar pelo proxy porque o cliente de chat roda no browser
    # e só enxerga a porta 80. Corpo grande para envio de anexos.
    # =================================================================
    location /_matrix {
      proxy_pass http://synapse:8008;
      proxy_http_version 1.1;
      proxy_set_header Host               $host;
      proxy_set_header X-Real-IP          $remote_addr;
      proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto  $the_scheme;
      proxy_set_header Upgrade            $http_upgrade;
      proxy_set_header Connection         $proxy_connection;
      client_max_body_size 100M;
      proxy_read_timeout 3600s;
    }
    location /_synapse/client {
      proxy_pass http://synapse:8008;
      proxy_http_version 1.1;
      proxy_set_header Host               $host;
      proxy_set_header X-Real-IP          $remote_addr;
      proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto  $the_scheme;
    }

    # =================================================================
    # RAIZ DO SITE — correção de defeito de usuário final
    # O webapp ROOT do eXo 7.2 é o WebDAV: pedir "/" devolve
    # 302 -> /webdav/drives -> 401, ou seja, quem digita
    # http://192.168.1.59/ recebe uma caixa de autenticação WebDAV
    # em vez do portal. Verificado direto no Tomcat, sem o proxy:
    #   docker exec exo-app curl -D- http://localhost:8080/
    #   HTTP/1.1 302  Location: /webdav/drives
    # O redirecionamento é feito aqui, no ponto de entrada. "location = /"
    # é correspondência EXATA e tem precedência sobre todos os regex,
    # portanto intercepta apenas a raiz e não afeta nenhuma outra rota
    # (/webdav continua acessível para clientes WebDAV reais).
    # =================================================================
    location = / {
      return 302 /portal/;
    }

    # --- Healthcheck do próprio proxy (adicionado) ---
    location = /nginx-health {
      access_log off;
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }

    # Serve small shim JS files locally to avoid noisy 404s from the
    # application when certain legacy paths are requested.
    location ^~ /js/ {
      root /usr/share/nginx/html;
      access_log off;
      add_header Content-Type application/javascript;
    }

    # =================================================================
    # ONLYOFFICE DocumentServer — rotas idênticas ao upstream
    # =================================================================
    location ~ ((/websocket)|(\/[\d]+\.[\d]+\.[\d]+[\.|-][\d]+(.+)\/websocket)|^(\/[\d]+\.[\d]+\.[\d]+[\.|-].+)?(\/doc\/.*)) {
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $the_host;
      proxy_set_header X-Forwarded-Proto $the_scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_http_version 1.1;
      proxy_pass http://onlyoffice$1$2$is_args$args;
    }
    location ~ ^(\/[\d]+\.[\d]+\.[\d]+[\.|-].+)/ {
      proxy_pass http://onlyoffice;
    }
    location ~ ^/OfficeWeb {
      proxy_pass http://onlyoffice;
    }
    location ~ ^/downloadfile {
      proxy_pass http://onlyoffice;
    }
    location ~ ^/converter {
      proxy_pass http://onlyoffice;
    }
    location ~ ^/printfile {
      proxy_pass http://onlyoffice;
    }
    location ~ ^/cache {
      proxy_pass http://onlyoffice;
    }
    location ~ ^/web-apps {
      proxy_pass http://onlyoffice;
    }
    location ~ ^/healthcheck {
      proxy_pass http://onlyoffice;
    }
    location ~ ^/coauthoring {
      add_header X-Frame-Options SAMEORIGIN always;
      proxy_pass http://onlyoffice;
    }
    # Websocket da edição colaborativa ao vivo
    # (mesma regra de heranca: repetir os cabecalhos do nivel server)
    location ~ /websocket$ {
      proxy_http_version 1.1;
      proxy_set_header Upgrade            $http_upgrade;
      proxy_set_header Connection         "upgrade";
      proxy_set_header Host               $http_host;
      proxy_set_header X-Real-IP          $remote_addr;
      proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto  $the_scheme;
      proxy_set_header X-Forwarded-Host   $the_host;
      proxy_pass http://onlyoffice;
    }

    # =================================================================
    # eXo Platform
    # =================================================================
    # IMPORTANTE — regra de heranca do nginx:
    # basta UM proxy_set_header dentro de um location para que TODOS os
    # proxy_set_header herdados do nivel server sejam descartados. Por isso
    # os cabecalhos abaixo sao repetidos integralmente em cada location que
    # define qualquer header proprio. Omiti-los fez o nginx enviar
    # "Host: <nome-do-upstream>" e o Tomcat responder 400 a todas as paginas.
    location / {
        proxy_pass http://exoapp;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $the_scheme;
        proxy_set_header X-Forwarded-Host   $the_host;
    }

    # Websocket do Cometd (notificações e chat em tempo real)
    location /cometd/cometd {
        proxy_pass http://exoapp;
        proxy_http_version 1.1;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         "upgrade";
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $the_scheme;
        proxy_set_header X-Forwarded-Host   $the_host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
  }
}

# ===================================================================
# Bundle de navegacao do site "myworkspace" — pt-BR
# Substitui WEB-INF/classes/locale/navigation/portal/myworkspace_pt_BR.properties
# de digital-workplace.war (injetado pela imagem, ver Dockerfile.exo).
#
# DUAS correcoes em relacao ao arquivo da imagem oficial 7.2.1:
#
# 1. TRADUCAO. O myworkspace_pt_BR.properties da imagem esta integralmente
#    EM INGLES (identico byte a byte ao myworkspace_en.properties). Com
#    EXO_JVM_USER_LANGUAGE=pt o menu "Meu Espaco" aparecia em ingles.
#
# 2. CHAVE AUSENTE portal.myworkspace.notes — DEFEITO DE EMPACOTAMENTO
#    DO PROPRIO eXo 7.2.1, e a causa real do defeito [049].
#    navigation.xml de digital-workplace.war declara o no:
#        <name>notes</name>
#        <label>#{portal.myworkspace.notes}</label>
#        <page-reference>portal::global::notes</page-reference>
#    mas NENHUM dos ~50 bundles myworkspace_*.properties da imagem
#    (nem o _en) define portal.myworkspace.notes. Sem a chave, o portal
#    exibe o literal "#portal.myworkspace.notes" no menu.
#    A pagina portal::global::notes EXISTE (vem de notes.war), portanto o
#    item de menu e' funcional — a correcao certa e' ACRESCENTAR a chave,
#    e nao remover o no da navegacao (o que apagaria a funcionalidade
#    Notas do menu, foi o que sessoes anteriores fizeram por engano).
#    Rotulo escolhido: "Notas", coerente com portal.global.notes de
#    notes.war.
#
# Codificacao: UTF-8 — mesma dos bundles pt_BR da imagem oficial.
# ===================================================================
portal.myworkspace.name=Meu Espaço
portal.myworkspace.description=Meu espaço de trabalho pessoal

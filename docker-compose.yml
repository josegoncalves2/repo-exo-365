# ===================================================================
# eXo Platform Community 7.2.1 — Stack completa (substituição Office 365)
# Host: 192.168.1.59 (pmoexo) — 4 vCPU / 9945 MB RAM
#
# Baseada no docker-compose.yml oficial de
#   github.com/exo-docker/exo-community (master)
# com os seguintes desvios DELIBERADOS, todos justificados em AUDIT.md:
#   1. Versão fixada em 7.2.1 — última estável (2026-07-30). A tag :latest
#      aponta para a linha 7.1.x de 2026-01-20, 7 meses atrás. Verificado
#      na API do Docker Hub em [034].
#   2. Segredos aleatórios em .env (o upstream traz senhas públicas fixas
#      'my-secret-pw' / 'my-super-secret-pw').
#   3. Limites de memória por container. O upstream não limita nada e o
#      host Proxmox já matou esta VM por OOM três vezes ([022],[025],[029]).
#   4. Healthchecks reais nos 8 serviços (o upstream não tem nenhum).
#   5. Mailpit — SMTP de captura, para COMPROVAR os fluxos de e-mail (T-10).
#   6. Synapse + PostgreSQL — ausentes do compose oficial. Na linha 7.x o eXo
#      trocou o chat nativo pela integração Matrix: sem homeserver o chat
#      não existe (T-08) e o boot ainda perde ~5 min tentando conectar.
#   7. Binários em filesystem (EXO_FILE_STORAGE_TYPE=fs), não em RDBMS.
#   8. Log de acesso do Tomcat habilitado (auditoria).
#
# PERSISTÊNCIA — LEIA ANTES DE MEXER
# ----------------------------------
# Todo o estado vive em BIND MOUNTS sob ./data/, e não em volumes nomeados.
# Em 2026-08-12 os dados do responsável foram destruídos por um
# `docker compose down -v`: a flag -v apaga volumes nomeados. Com bind mounts
# esse comando passa a NÃO apagar nada, e `docker system prune --volumes`
# também não os atinge.
#
#   ./data/exo-codec  guarda as CHAVES DE CRIPTOGRAFIA. Sem elas o banco
#   se torna ILEGÍVEL. Precisa ser copiado JUNTO com ./data/mysql.
#
# Donos dos diretórios (UIDs verificados dentro de cada imagem):
#   mysql -> 999:999   es -> 1000:0   exo -> 999:1001   postgres -> 999:999
# ===================================================================

name: exo

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:

  # NENHUM serviço declara `restart:` de propósito.
  # A política de reinício do Docker sobe TODOS os containers ao mesmo tempo
  # quando o daemon inicia, e isso tem dois efeitos indesejados aqui:
  #   1. pico de memória no boot — foi o que fez o hipervisor matar esta VM
  #      três vezes (AUDIT [022], [025], [029]);
  #   2. o nginx no ar antes do eXo, registrando `connect() failed (111)` por
  #      10-20 min — `depends_on: service_healthy` só vale para
  #      `docker compose up`, não para a política de reinício do daemon.
  # A subida é feita pela unidade systemd `exo.service`, que executa
  # scripts/subir-ordenado.sh: um serviço por vez, com trava de memória, e o
  # proxy por último. Ver AUDIT [047].

  # ----------------------------------------------------------------
  # Proxy reverso — único ponto de entrada (porta 80)
  # Roteia / para o eXo e as rotas de documento para o ONLYOFFICE
  # ----------------------------------------------------------------
  web:
    image: ${NGINX_IMAGE}
    container_name: exo-web
    ports:
      - "${EXO_HTTP_PORT:-80}:80"
      # TLS do portal (2026-08-20): usa a MESMA CA interna do Jitsi/MySQL,
      # reservado desde [099] pra nao colidir com a 8443. Motivo: video/
      # compartilhamento de tela exigem getUserMedia() em contexto seguro,
      # e um portal servido em HTTP puro forcava o usuario a aceitar um
      # aviso de certificado so' pro Jitsi, numa porta separada -- ruim pra
      # producao. Com o portal inteiro em HTTPS (mesma CA), uma unica
      # importacao da CA raiz nas estacoes elimina o aviso em TUDO de uma
      # vez, nao so' no video.
      - "443:443"
      # HTTPS do Jitsi ([099]). Porta separada e NÃO 443 porque o Jitsi Meet
      # exige ser servido na raiz do host (ver server block da 8443 em
      # nginx.conf).
      - "${JITSI_HTTPS_PORT:-8443}:8443"
    volumes:
      - ./conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf/static:/usr/share/nginx/html:ro
      # Certificado emitido pela CA interna do projeto ('PMO eXo Root CA',
      # a mesma do MySQL), válido até 2036, com SAN IP:192.168.1.59.
      - ./conf/jitsi-certs:/etc/nginx/jitsi-certs:ro
      - ./conf/portal-certs:/etc/nginx/portal-certs:ro
      # Close page redirect: quando a reuniao termina no Jitsi, o navegador
      # vai para /close.html (ou close2.html ou close3.html conforme versao).
      # O nginx serve estes arquivos como statics (nao faz proxy para o Jitsi),
      # que redireciona automaticamente para o portal apos 2.5s.
      - ./conf/jitsi/close-redirect.html:/jitsi-mounts/close.html:ro
      - ./conf/jitsi/close-redirect.html:/jitsi-mounts/close2.html:ro
      - ./conf/jitsi/close-redirect.html:/jitsi-mounts/close3.html:ro
    networks:
      default:
        aliases:
          - ${EXO_PROXY_VHOST}
    depends_on:
      # service_HEALTHY, não service_started. Com "started" o nginx sobe junto
      # com o Tomcat e passa ~15 min tentando alcançar um backend que ainda
      # não escuta, registrando dezenas de:
      #   [error] connect() failed (111: Connection refused) while connecting
      #           to upstream ... request: "GET /portal/ HTTP/1.1"
      # Esperar o eXo ficar saudável elimina a causa (e não o sintoma):
      # o proxy só passa a existir quando há o que servir.
      exo:
        condition: service_healthy
      onlyoffice:
        condition: service_healthy
    mem_limit: 128m
    healthcheck:
      # Aponta para /nginx-health (servido pelo próprio nginx), NÃO para "/".
      # Usar "/" faria o proxy ser reportado como doente sempre que o eXo
      # estivesse iniciando (502), confundindo "backend ainda subindo" com
      # "proxy quebrado". Usa 127.0.0.1 e não 'localhost': o wget do BusyBox
      # resolve localhost para ::1 primeiro, e isso já reportou o nginx como
      # doente estando são ([031]).
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: *default-logging

  # ----------------------------------------------------------------
  # eXo Platform — aplicação principal (Tomcat + JDK 21)
  # ----------------------------------------------------------------
  exo:
    image: ${EXO_IMAGE}
    # `docker compose up -d` sozinho NAO reconstroi a imagem -- so' usa o que
    # ja' existe localmente com essa tag. Para aplicar mudancas do
    # Dockerfile.exo (patches de idioma/branding/CSS/JS), rode
    # `docker compose build exo` ou `docker compose up -d --build` antes.
    build:
      context: .
      dockerfile: Dockerfile.exo
    container_name: exo-app
    environment:
      TZ: ${TZ}

      # --- Proxy frontend ---
      EXO_PROXY_VHOST: ${EXO_PROXY_VHOST}
      EXO_PROXY_PORT: ${EXO_PROXY_PORT}
      EXO_PROXY_SSL: ${EXO_PROXY_SSL}

      # --- Banco de dados ---
      EXO_DB_TYPE: mysql
      EXO_DB_HOST: mysql
      EXO_DB_PORT: 3306
      EXO_DB_NAME: ${EXO_DB_NAME}
      EXO_DB_USER: ${EXO_DB_USER}
      EXO_DB_PASSWORD: ${EXO_DB_PASSWORD}
      EXO_DB_TIMEOUT: 300
      EXO_DB_POOL_IDM_MAX_SIZE: 20
      EXO_DB_POOL_JCR_MAX_SIZE: 20
      EXO_DB_POOL_JPA_MAX_SIZE: 20

      # --- Busca (Elasticsearch) ---
      EXO_ES_HOST: es
      EXO_ES_PORT: 9200
      EXO_ES_SCHEME: http
      EXO_ES_INDEX_REPLICA_NB: 0
      EXO_ES_INDEX_SHARD_NB: 1
      EXO_ES_TIMEOUT: 300

      # --- JVM (dimensionada para 9945 MB de RAM total) ---
      EXO_JVM_SIZE_MIN: ${EXO_JVM_SIZE_MIN}
      EXO_JVM_SIZE_MAX: ${EXO_JVM_SIZE_MAX}
      EXO_JVM_METASPACE_SIZE_MAX: ${EXO_JVM_METASPACE_SIZE_MAX}
      EXO_JVM_USER_LANGUAGE: ${EXO_JVM_USER_LANGUAGE}
      EXO_JVM_USER_REGION: ${EXO_JVM_USER_REGION}
      EXO_JVM_LOG_GC_ENABLED: "true"

      # --- Armazenamento: binários em filesystem (backup e performance) ---
      EXO_DATA_DIR: /srv/exo
      EXO_FILE_STORAGE_TYPE: fs
      EXO_JCR_FS_STORAGE_ENABLED: "true"
      EXO_UPLOAD_MAX_FILE_SIZE: 500

      # --- Tomcat ---
      EXO_HTTP_THREAD_MAX: 200
      EXO_HTTP_THREAD_MIN: 10
      EXO_ACCESS_LOG_ENABLED: "true"
      EXO_GZIP_ENABLED: "true"

      # --- E-mail (SMTP) ---
      EXO_MAIL_FROM: ${EXO_MAIL_FROM}
      EXO_MAIL_SMTP_HOST: ${EXO_MAIL_SMTP_HOST}
      EXO_MAIL_SMTP_PORT: ${EXO_MAIL_SMTP_PORT}
      EXO_MAIL_SMTP_STARTTLS: ${EXO_MAIL_SMTP_STARTTLS}
      EXO_MAIL_SMTP_USERNAME: ${EXO_MAIL_SMTP_USERNAME}
      EXO_MAIL_SMTP_PASSWORD: ${EXO_MAIL_SMTP_PASSWORD}

      # --- Conversão de documentos (JOD/LibreOffice embutido) ---
      EXO_JODCONVERTER_PORTS: "2002,2003,2004"

      # --- Carteira de recompensas (gamificação) ---
      EXO_REWARDS_WALLET_ADMIN_KEY: ${EXO_REWARDS_WALLET_ADMIN_KEY}

      # --- Monitoramento ---
      EXO_JMX_ENABLED: "true"
      EXO_JMX_RMI_SERVER_HOSTNAME: exo

      # --- Integração ONLYOFFICE (edição colaborativa de documentos) ---
      JAVA_OPTS: >-
        -Donlyoffice.documentserver.host=${EXO_PROXY_VHOST}
        -Donlyoffice.documentserver.schema=${EXO_PROXY_SCHEMA}
        -Donlyoffice.documentserver.allowedhosts=localhost,onlyoffice,${EXO_PROXY_VHOST}
        -Donlyoffice.documentserver.accessOnly=false
        -Donlyoffice.documentserver.secret=${ONLYOFFICE_JWT_SECRET}
        -Djavax.net.ssl.trustStore=/etc/exo/truststore/truststore-pmo.p12
        -Djavax.net.ssl.trustStoreType=PKCS12
        -Djavax.net.ssl.trustStorePassword=${EXO_TRUSTSTORE_PASSWORD}
    volumes:
      - ./data/exo:/srv/exo
      # Truststore da JVM (ACRESCENTADA em 2026-08-27, nada foi substituido).
      #
      # POR QUE EXISTE: o add-on de IA (ai-mcp-client) resolve o cliente OAuth2
      # chamando ClientRegistrations.fromIssuerLocation() contra
      # https://${EXO_PROXY_VHOST}/auth-server/.well-known/openid-configuration.
      # Esse endereco usa a PKI interna (PMO eXo Root CA -> Intermediate), que
      # NAO esta na cacerts da imagem. O handshake morria com
      #   PKIX path building failed: unable to find valid certification path
      # -> sem documento de descoberta -> "tokenUri cannot be empty" -> o
      # contexto Spring 'ai-agent' INTEIRO falhava, derrubando o assistente.
      # Medido no platform.log em 2026-08-27 11:18:54.
      #
      # O arquivo e' a cacerts da PROPRIA imagem com as duas CAs internas
      # ACRESCENTADAS: 111 -> 113 entradas, delta 2 conferido no keytool.
      # Superconjunto estrito, entao MySQL/ES/SMTP/ONLYOFFICE seguem confiando
      # exatamente no que confiavam antes -- trocar a truststore por uma que
      # contivesse SO' a CA interna quebraria toda saida TLS para a internet.
      #
      # Ele guarda apenas certificados PUBLICOS: nao ha chave privada aqui.
      - ./conf/truststore/truststore-pmo.p12:/etc/exo/truststore/truststore-pmo.p12:ro
      # Extensao DLP por padrao (ACRESCENTADA em 2026-08-27).
      #
      # O add-on exo-dlp so' sabe casar PALAVRA-CHAVE contra o indice do
      # Elasticsearch. Isso nao encontra "111.444.777-35" a menos que alguem
      # cadastre esse CPF como palavra-chave, o que e' absurdo. A extensao
      # acrescenta deteccao por PADRAO com digito verificador conferido, mais
      # classificacao, mascaramento e politica central.
      #
      # E' UM ARQUIVO, nao um diretorio: montar um DIRETORIO sobre
      # /opt/exo/lib esconderia os 567 jars da plataforma e o portal nao subiria.
      #
      # O nome comeca com "zz-" de proposito. A prioridade declarada no
      # conf/portal/configuration.xml do jar (100) e' o que de fato decide a
      # ordem de registro; o prefixo e' a segunda linha de defesa, para o caso
      # de a varredura do classpath vir ordenada por nome.
      #
      # MODO DE FALHAR: se o registro nao prevalecer, o conector nativo
      # permanece e o DLP se comporta exatamente como antes. Nunca pior.
      # Construido por extensao/dlp-br/construir.sh, que compila DENTRO desta
      # mesma imagem contra o /opt/exo/lib real.
      - ./extensao/dlp-br/target/dlp-br.jar:/opt/exo/lib/zz-dlp-br.jar:ro
      # Extensao 2FA POR ZONA DE REDE (ACRESCENTADA em 2026-08-27).
      #
      # O add-on exo-multifactor-authentication so' sabe exigir segundo fator
      # por GRUPO e por AREA DE NAVEGACAO. Nao ha' nada nele que olhe o
      # endereco de origem: MfaService tem exatamente dois criterios,
      # isProtectedUri e currentUserIsInProtectedGroup. "2FA por zona"
      # simplesmente nao existia.
      #
      # A extensao NAO duplica nada do add-on: nao gera codigo, nao guarda
      # segredo, nao desenha tela e nao valida OTP. Ela so' responde "este
      # acesso, vindo daqui, precisa de segundo fator?" e reaproveita a MESMA
      # tela (/portal/dw/mfa-access) e as MESMAS marcas de sessao.
      #
      # NASCE INERTE: sem exo.mfa.zonas.exigir preenchido, nada muda.
      - ./extensao/mfa-zona/target/mfa-zona.jar:/opt/exo/lib/zz-mfa-zona.jar:ro
      # Extensao RESTRICOES AVANCADAS DE DOWNLOAD E COMPARTILHAMENTO
      # (ACRESCENTADA em 2026-08-27).
      #
      # O nativo (TransferRulesRestService) sao DOIS INTERRUPTORES GLOBAIS
      # guardados no SettingService: sharedDocumentStatus e
      # downloadDocumentStatus. Liga e desliga, para o portal inteiro, para
      # todo mundo. O briefing pede restricao "com base em permissoes e
      # politicas da empresa" ; dois interruptores globais sao um disjuntor,
      # nao uma politica.
      #
      # A extensao traz motor de regras (grupo, grupo-excluido, extensao,
      # tamanho, zona de rede, operacao), primeira-que-casa, com a regra
      # responsavel NOMEADA em cada decisao para poder responder "por que nao
      # consigo baixar este arquivo".
      #
      # DEPENDE de zz-mfa-zona.jar (br.pmo.mfa.Zona) para as condicoes de
      # rede. Reaproveitar em vez de copiar evita duas implementacoes de CIDR
      # divergindo com o tempo. O prefixo "zzz-" garante a ordem de carga
      # depois da dependencia.
      #
      # NASCE EM OBSERVACAO: avalia, registra o que impediria, e NAO impede.
      - ./extensao/transferencia/target/transferencia.jar:/opt/exo/lib/zzz-transferencia.jar:ro
      # Relatorio do ClamAV. FICA FORA de ./data/exo de proposito: o alvo da
      # varredura (./data/exo/files) e' montado SOMENTE-LEITURA no container
      # do scanner, e o relatorio precisa de escrita dos dois lados — o
      # ClamAV anexa as deteccoes, o eXo trunca depois de processar.
      # Ver servico `clamav` no fim deste arquivo.
      - ./data/antimalware:/srv/antimalware:rw
      # CHAVES DE CRIPTOGRAFIA — copiar sempre junto com ./data/mysql
      - ./data/exo-codec:/etc/exo/codec:rw
      - ./data/exo-logs:/var/log/exo
      - ./conf/exo.properties:/etc/exo/exo.properties:ro
      # NUNCA montar nada sob /opt/exo/webapps/<app>/ — ver AUDIT [075].
      # /opt/exo/webapps contém ARQUIVOS .war, não diretórios. Um bind mount
      # em /opt/exo/webapps/<app>/qualquer/coisa faz o Docker criar o
      # diretório /opt/exo/webapps/<app>/ (root:root) antes do Tomcat subir;
      # o Tomcat encontra um diretório de webapp já existente, não consegue
      # removê-lo (é ponto de montagem), NÃO desempacota o .war e implanta o
      # diretório praticamente vazio como se fosse a aplicação.
      # Duas montagens assim existiam aqui e destruíam duas webapps:
      #   ./conf/i18n      -> .../digital-workplace/WEB-INF/classes/locale/...
      #   ./conf/webdav-web.xml -> .../webdav/WEB-INF/web.xml
      # Como digital-workplace é quem fornece o site myworkspace, sua
      # navegação e suas páginas, o portal inteiro passou a responder
      # HTTP 200 com corpo VAZIO, com NullPointerException em
      # PortalURLContext._render(). Os três arquivos passaram a ser
      # injetados DENTRO dos .war em tempo de build — ver Dockerfile.exo.
    depends_on:
      mysql:
        condition: service_healthy
      es:
        condition: service_healthy
      mailpit:
        condition: service_started
      onlyoffice:
        condition: service_started
    mem_limit: ${MEM_LIMIT_EXO}
    healthcheck:
      # /portal/login é servido pelo portal e responde 200 SEM autenticação,
      # somente depois que o Tomcat termina de implantar as ~70 webapps.
      # (A rota /rest/v1/platform/info, usada antes, NÃO EXISTE na 7.2.1 —
      #  devolve 404 e deixaria o container eternamente "unhealthy".)
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:8080/portal/login || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 40
      start_period: 300s
    logging: *default-logging

  # ----------------------------------------------------------------
  # MySQL 8.4 — banco de dados (IDM + JCR + JPA)
  # ----------------------------------------------------------------
  mysql:
    image: ${MYSQL_IMAGE}
    container_name: exo-mysql
    command: --mysql-native-password=OFF
    environment:
      TZ: ${TZ}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${EXO_DB_NAME}
      MYSQL_USER: ${EXO_DB_USER}
      MYSQL_PASSWORD: ${EXO_DB_PASSWORD}
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./conf/mysql.cnf:/etc/mysql/conf.d/exo.cnf:ro
      # PKI de 2 níveis — ver o comentário em conf/mysql.cnf. Elimina o
      # aviso MY-010068 (CA autoassinada) mantendo a conexão cifrada.
      - ./conf/mysql-certs:/etc/mysql/certs:ro
      # Diretório do pid-file com modo 750 (os padrões /var/run/mysqld e
      # /var/lib/mysql têm modo 1777 e disparam o aviso MY-011810).
      - ./data/mysql-run:/var/lib/mysql-run
    mem_limit: ${MEM_LIMIT_MYSQL}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    logging: *default-logging

  # ----------------------------------------------------------------
  # Elasticsearch 8.18 — busca unificada (documentos, pessoas, atividades)
  # ----------------------------------------------------------------
  es:
    image: ${ES_IMAGE}
    container_name: exo-es
    environment:
      - TZ=${TZ}
      - ES_JAVA_OPTS=-Xms${ES_HEAP} -Xmx${ES_HEAP}
      - node.name=exo
      - cluster.name=exo
      # cluster.initial_master_nodes NÃO aparece aqui de propósito.
      # Ele serve APENAS ao primeiro start (bootstrap do cluster). Mantê-lo
      # depois faz o ES avisar, a cada início:
      #   "this node is locked into cluster UUID [...] but
      #    [cluster.initial_master_nodes] is set to [exo]; remove this setting
      #    to avoid possible data loss caused by subsequent cluster bootstrap"
      # `discovery.type=single-node` substitui o bootstrap explícito: o nó se
      # elege sozinho, sem a variável e sem o aviso — e é o que descreve esta
      # instalação, que é de nó único por desenho.
      - discovery.type=single-node
      - network.host=_site_
      # http.host=0.0.0.0 é OBRIGATÓRIO: com apenas network.host=_site_ (valor
      # do upstream), a camada HTTP liga somente no IP do container e qualquer
      # verificação via localhost falha com "Couldn't connect" — foi o que
      # travou o primeiro deploy. Não expõe nada ao host: 9200 não é publicada.
      - http.host=0.0.0.0
      - xpack.security.enabled=false
      - xpack.ml.enabled=false
      # NÃO acrescentar `xpack.inference.enabled`: essa opção NÃO EXISTE no
      # Elasticsearch 8.18.8 e o servidor se RECUSA A INICIAR com ela —
      # testado, com o nó em laço de reinício:
      #   java.lang.IllegalArgumentException: unknown setting
      #   [xpack.inference.enabled] did you mean [xpack.ent_search.enabled]?
      # O ES valida as opções na inicialização e trata desconhecida como
      # erro fatal, não como aviso. O aviso de "default inference endpoint
      # IDs [rainbow-sprinkles]" ocorre porque o serviço de inferência tenta
      # agir antes de o estado do cluster ser recuperado.
      #
      # MEDIDO: em nó único iniciando do zero o aviso **se repete**:
      #   [WARN] Failed to revoke access to default inference endpoint IDs:
      #          [rainbow-sprinkles] ... ClusterBlockException: blocked by:
      #          [SERVICE_UNAVAILABLE/1/state not recovered / initialized]
      # É transitório e se resolve sozinho quando o estado do cluster é
      # recuperado — o serviço de inferência tenta agir cedo demais. Como a
      # opção para desligar o módulo não existe nesta versão, eleva-se o
      # nível APENAS do logger que o emite. Nenhum outro logger é afetado:
      # a raiz continua em INFO e qualquer erro real do ES aparece.
      # O ajuste é feito em conf/es-log4j2.properties (montado abaixo):
      # passar `logger.<nome>=ERROR` por variável de ambiente NÃO funciona —
      # a variável chega ao container, mas o ES não a converte em ajuste de
      # logger. Verificado com `docker inspect` + leitura do log.
      - bootstrap.memory_lock=false
    volumes:
      - ./data/elasticsearch:/usr/share/elasticsearch/data:rw
      - ./conf/es-log4j2.properties:/usr/share/elasticsearch/config/log4j2.properties:ro
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
      memlock: { soft: -1, hard: -1 }
    mem_limit: ${MEM_LIMIT_ES}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
    logging: *default-logging

  # ----------------------------------------------------------------
  # ONLYOFFICE DocumentServer — edição colaborativa online
  # (equivalente a Word / Excel / PowerPoint Online do Office 365)
  # ----------------------------------------------------------------
  onlyoffice:
    image: ${ONLYOFFICE_IMAGE}
    container_name: onlyoffice
    environment:
      TZ: ${TZ}
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET}
      SECURE_LINK_SECRET: ${ONLYOFFICE_SECURE_LINK_SECRET}
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      ALLOW_META_IP_ADDRESS: "true"
    volumes:
      - ./data/onlyoffice/data:/var/www/onlyoffice/Data
      - ./data/onlyoffice/log:/var/log/onlyoffice
      - ./data/onlyoffice/cache:/var/lib/onlyoffice/documentserver/App_Data/cache/files
    mem_limit: ${MEM_LIMIT_ONLYOFFICE}
    healthcheck:
      # O teste passa PRIMEIRO direto no DocService (porta 8000) e só depois
      # pelo nginx interno (porta 80). A ordem não é estética:
      #   o nginx do ONLYOFFICE sobe em segundos, o DocService leva ~1 min.
      #   Sondar /healthcheck pelo nginx nesse intervalo faz o próprio nginx
      #   registrar, no log do container:
      #     [error] connect() failed (111: Connection refused) while connecting
      #             to upstream, request: "GET /healthcheck HTTP/1.1"
      #   `start_period` não evita isso: ele só impede que a falha CONTE
      #   contra a saúde do container — a sondagem continua sendo executada,
      #   e o erro continua sendo gravado.
      # Verificar antes se há upstream vivo elimina a causa (pedir ao proxy
      # algo que ele ainda não tem como servir), e não o sintoma. O teste
      # segue sendo real: só reporta saudável quando /healthcheck responde
      # `true` através do nginx, que é o caminho que o eXo de fato usa.
      # NOTA sobre a 1a sonda: é `curl -sS` SEM `-f`, de propósito. O que se
      # quer saber dela é só "há alguém escutando na 8000", e a raiz do
      # DocService responde 404 (não tem rota "/"). Com `-f` o curl trata 404
      # como falha e o container nunca ficaria saudável — testado. Sem `-f`,
      # o comando só falha quando a conexão é RECUSADA (curl exit 7), que é
      # exatamente a condição que se quer detectar. A verificação de verdade
      # é a 2a, através do nginx, e essa continua com `-f`.
      test: ["CMD-SHELL", "curl -sS -o /dev/null http://localhost:8000/ && curl -fsS http://localhost/healthcheck | grep -q true"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s
    logging: *default-logging

  # ----------------------------------------------------------------
  # Mailpit — servidor SMTP de captura + webmail de inspeção
  # Permite PROVAR que convites, notificações e reset de senha saem.
  # Para SMTP real: alterar EXO_MAIL_SMTP_* no .env e recriar o serviço exo.
  # ----------------------------------------------------------------
  mailpit:
    image: ${MAILPIT_IMAGE}
    container_name: exo-mailpit
    environment:
      TZ: ${TZ}
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    volumes:
      - ./data/mailpit:/data
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *default-logging

  # ----------------------------------------------------------------
  # Interface web da estrutura organizacional (Secretaria/Divisao/Setor):
  # NAO E' MAIS UM SERVICO DESTE COMPOSE.
  #
  # Por decisao operacional (nenhum container novo neste projeto) ela roda no
  # HOST, como unidade systemd:
  #
  #     /etc/systemd/system/exo-estrutura.service
  #     systemctl status|restart exo-estrutura
  #     journalctl -u exo-estrutura -f
  #
  # Escuta em 172.20.0.1:878 -- o gateway da rede exo_net. Isso mantem o
  # alcance de antes (o nginx do stack chega) sem abrir a porta para a LAN,
  # que era o unico ganho real do container. O nginx a publica em /estrutura/
  # (conf/nginx.conf: proxy_pass http://172.20.0.1:878/).
  #
  # O bloco antigo foi REMOVIDO em vez de comentado de proposito: comentado,
  # um 'docker compose up -d' distraido nao recriaria nada, mas o proximo
  # leitor descomentaria "para consertar" e teria dois servicos disputando a
  # porta 878 e o mesmo arquivo de registro.
  # ----------------------------------------------------------------

  # ----------------------------------------------------------------
  # Matrix / Synapse — servidor de chat (equivalente ao Teams)
  # NÃO faz parte do docker-compose.yml oficial do eXo. Foi acrescentado
  # porque na linha 7.x o eXo substituiu o chat nativo pela integração
  # com o protocolo Matrix: sem um homeserver, o chat simplesmente não
  # existe e o boot ainda perde ~5 min em 20 tentativas de conexão.
  # Parâmetros de integração conforme github.com/Meeds-io/matrix
  # ----------------------------------------------------------------
  synapse-db:
    image: ${SYNAPSE_DB_IMAGE}
    container_name: exo-synapse-db
    environment:
      POSTGRES_DB: synapse
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: ${MATRIX_DB_PASSWORD}
      # Synapse EXIGE estas opções de collation; sem elas recusa iniciar.
      # --auth-local/--auth-host evitam o aviso do initdb:
      #   'initdb: warning: enabling "trust" authentication for local connections'
      # (o padrão da imagem é 'trust', que dispensa senha no socket local).
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C --auth-local=scram-sha-256 --auth-host=scram-sha-256"
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      TZ: ${TZ}
    volumes:
      - ./data/synapse-db:/var/lib/postgresql/data
    mem_limit: ${MEM_LIMIT_SYNAPSE_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse -d synapse"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    logging: *default-logging

  synapse:
    image: ${SYNAPSE_IMAGE}
    container_name: exo-synapse
    environment:
      SYNAPSE_SERVER_NAME: ${MATRIX_SERVER_NAME}
      SYNAPSE_REPORT_STATS: "no"
      SYNAPSE_CONFIG_DIR: /data
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
      TZ: ${TZ}
    volumes:
      - ./data/synapse:/data
    depends_on:
      synapse-db:
        condition: service_healthy
    mem_limit: ${MEM_LIMIT_SYNAPSE}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8008/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 60s
    logging: *default-logging

  # ----------------------------------------------------------------
  # JITSI MEET — videoconferência auto-hospedada  (AUDIT [099])
  # ----------------------------------------------------------------
  # POR QUE ESTES 4 CONTAINERS EXISTEM
  # O eXo Community 7.2.1 entrega o framework de videoconferência
  # (webconferencing.war) e UM conector: External Visio. Esse conector não
  # tem servidor de mídia — ele só faz window.open() numa URL de reunião
  # (external-visio/js/webconferencing-externalvisio.js). Sem SFU, o botão
  # de chamada não tem para onde apontar e a videoconferência não existe.
  # O Jitsi é auto-hospedado AQUI para que nenhuma chamada dependa de
  # terceiros (nada vai para meet.jit.si).
  #
  # A divisão em 4 processos é do próprio Jitsi, não uma escolha nossa:
  #   prosody = servidor XMPP (sinalização)
  #   jicofo  = focus, aloca participantes em pontes
  #   jvb     = a ponte de mídia (SFU) — é quem carrega o RTP
  #   web     = a interface Jitsi Meet (nginx + arquivos estáticos)
  #
  # Assim como os demais, NENHUM declara `restart:` — a subida é ordenada
  # por scripts/subir-ordenado.sh (ver comentário no topo deste arquivo).

  jitsi-prosody:
    image: ${JITSI_IMAGE_PROSODY}
    container_name: exo-jitsi-prosody
    environment:
      # Estes nomes de domínio são INTERNOS do Jitsi (XMPP), não são DNS
      # público — não precisam resolver fora da rede exo_net.
      XMPP_DOMAIN: ${JITSI_XMPP_DOMAIN}
      XMPP_AUTH_DOMAIN: auth.${JITSI_XMPP_DOMAIN}
      XMPP_MUC_DOMAIN: muc.${JITSI_XMPP_DOMAIN}
      XMPP_INTERNAL_MUC_DOMAIN: internal-muc.${JITSI_XMPP_DOMAIN}
      JICOFO_COMPONENT_SECRET: ${JICOFO_COMPONENT_SECRET}
      JICOFO_AUTH_USER: focus
      JICOFO_AUTH_PASSWORD: ${JICOFO_AUTH_PASSWORD}
      JVB_AUTH_USER: jvb
      JVB_AUTH_PASSWORD: ${JVB_AUTH_PASSWORD}
      # 2026-08-21 -- AUTENTICACAO JWT (addon oficial eXo Jitsi).
      # Antes: ENABLE_AUTH=0 / ENABLE_GUESTS=1, sala aberta a quem tem o link.
      # Isso e' exatamente o que fazia a experiencia NAO ser uma ligacao: ao
      # abrir o link o Jitsi pedia o nome e jogava em lobby/"participar".
      # Com JWT o token ja' carrega a identidade do usuario do portal e a
      # autorizacao da sala -- entra direto, sem digitar nome e sem lobby.
      # O token e' assinado pelo microservico jitsi-call com JWT_APP_SECRET.
      ENABLE_AUTH: 1
      AUTH_TYPE: jwt
      JWT_APP_ID: ${JITSI_JWT_APP_ID}
      JWT_APP_SECRET: ${JITSI_JWT_APP_SECRET}
      JWT_ACCEPTED_ISSUERS: ${JITSI_JWT_APP_ID}
      JWT_ACCEPTED_AUDIENCES: ${JITSI_JWT_APP_ID}
      # ENABLE_GUESTS=1 (2026-08-21, correcao): com 0, SO' quem chega com JWT
      # do portal entra -- isso matou a REUNIAO/WEBINAR (criar sala e mandar o
      # link para as pessoas entrarem). Com 1, os dois casos convivem:
      #   - ligacao 1:1 pelo chat  -> JWT, entra direto, sem digitar nome
      #   - reuniao por link       -> convidado entra pela sala avulsa
      ENABLE_GUESTS: 1
      TZ: ${TZ}
    volumes:
      - ./data/jitsi/prosody:/config
    networks:
      default:
        aliases:
          - xmpp.meet.jitsi
    mem_limit: ${MEM_LIMIT_JITSI_PROSODY}
    healthcheck:
      # NÃO usar 'prosodyctl status' aqui: nesta imagem o prosody roda sob
      # supervisão do s6 e o pidfile que o prosodyctl consulta não é escrito,
      # então ele responde "Prosody is not running" com o serviço NO AR
      # (medido: processo lua vivo e BOSH respondendo). O teste abaixo é
      # funcional — exercita o módulo HTTP do próprio prosody, que é o que
      # o cliente Jitsi realmente usa para sinalização.
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:5280/http-bind || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 30s
    logging: *default-logging

  jitsi-jicofo:
    image: ${JITSI_IMAGE_JICOFO}
    container_name: exo-jitsi-jicofo
    environment:
      XMPP_DOMAIN: ${JITSI_XMPP_DOMAIN}
      XMPP_AUTH_DOMAIN: auth.${JITSI_XMPP_DOMAIN}
      XMPP_INTERNAL_MUC_DOMAIN: internal-muc.${JITSI_XMPP_DOMAIN}
      XMPP_MUC_DOMAIN: muc.${JITSI_XMPP_DOMAIN}
      XMPP_SERVER: xmpp.meet.jitsi
      JICOFO_COMPONENT_SECRET: ${JICOFO_COMPONENT_SECRET}
      JICOFO_AUTH_USER: focus
      JICOFO_AUTH_PASSWORD: ${JICOFO_AUTH_PASSWORD}
      # O padrão da imagem pede 3 GB de heap, que NÃO cabe nesta VM.
      # Ver o orçamento de memória comentado no .env.
      JICOFO_MAX_MEMORY: ${JICOFO_MAX_MEMORY}
      # 2026-08-21 -- JWT do addon oficial eXo Jitsi (ver jitsi-prosody).
      ENABLE_AUTH: 1
      AUTH_TYPE: jwt
      JWT_APP_ID: ${JITSI_JWT_APP_ID}
      JWT_APP_SECRET: ${JITSI_JWT_APP_SECRET}
      JWT_ACCEPTED_ISSUERS: ${JITSI_JWT_APP_ID}
      JWT_ACCEPTED_AUDIENCES: ${JITSI_JWT_APP_ID}
      # ENABLE_GUESTS=1 (2026-08-21, correcao): com 0, SO' quem chega com JWT
      # do portal entra -- isso matou a REUNIAO/WEBINAR (criar sala e mandar o
      # link para as pessoas entrarem). Com 1, os dois casos convivem:
      #   - ligacao 1:1 pelo chat  -> JWT, entra direto, sem digitar nome
      #   - reuniao por link       -> convidado entra pela sala avulsa
      ENABLE_GUESTS: 1
      TZ: ${TZ}
    volumes:
      - ./data/jitsi/jicofo:/config
    depends_on:
      jitsi-prosody:
        condition: service_healthy
    mem_limit: ${MEM_LIMIT_JICOFO}
    healthcheck:
      # /about/health NAO EXISTE nesta versao do jicofo (medido: 404; os
      # endpoints reais sao /about/version, /stats, /metrics e /debug). Usar
      # /about/health deixaria o container eternamente "health: starting"
      # com o servico PERFEITO — foi o que ocorreu na primeira subida.
      #
      # O teste abaixo não é um "ping de vida": operational_bridge_count só é
      # >= 1 quando o jicofo está no ar, autenticado no prosody E enxergando
      # uma ponte de mídia (JVB) operacional. Ou seja, ele reprova exatamente
      # nos casos em que a videoconferência não funcionaria.
      test: ["CMD-SHELL", "curl -fsS --max-time 5 http://localhost:8888/stats | grep -qE '\"operational_bridge_count\":[[:space:]]*[1-9]' || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 60s
    logging: *default-logging

  jitsi-jvb:
    image: ${JITSI_IMAGE_JVB}
    container_name: exo-jitsi-jvb
    ports:
      # UDP 10000 é a MÍDIA (RTP/ICE). Precisa chegar DIRETO ao navegador:
      # não passa pelo nginx, não é HTTP e não pode ser proxiado.
      - "${JITSI_JVB_PORT}:${JITSI_JVB_PORT}/udp"
    environment:
      XMPP_AUTH_DOMAIN: auth.${JITSI_XMPP_DOMAIN}
      XMPP_INTERNAL_MUC_DOMAIN: internal-muc.${JITSI_XMPP_DOMAIN}
      XMPP_SERVER: xmpp.meet.jitsi
      JVB_AUTH_USER: jvb
      JVB_AUTH_PASSWORD: ${JVB_AUTH_PASSWORD}
      JVB_PORT: ${JITSI_JVB_PORT}
      # SEM ISTO A CHAMADA CONECTA E FICA SEM VÍDEO: dentro do container o
      # JVB só enxerga o IP da rede docker (172.x) e anunciaria esse
      # candidato ICE ao navegador, que não tem rota para ele. O endereço
      # anunciado precisa ser o IP real da VM.
      JVB_ADVERTISE_IPS: ${JITSI_JVB_ADVERTISE_IP}
      # DEPENDENCIA EXTERNA ELIMINADA ([099]): por padrão a imagem do JVB
      # aponta o STUN para "meet-jit-si-turnrelay.jitsi.net:443" — ou seja,
      # servidores da Jitsi pública. Isso contraria o requisito de não
      # depender de provedor externo e vazaria metadados de rede para fora.
      # Aqui o STUN não faz falta: cliente e ponte estão na MESMA rede local,
      # e o candidato ICE correto já é anunciado por JVB_ADVERTISE_IPS.
      # Medido depois de desligar: mídia continua fluindo (audio+video).
      # Se um dia houver participantes fora da LAN, a saída é subir um
      # coturn PRÓPRIO nesta stack — nunca reativar o STUN público.
      JVB_DISABLE_STUN: 1
      JVB_MAX_MEMORY: ${JVB_MAX_MEMORY}
      TZ: ${TZ}
    volumes:
      - ./data/jitsi/jvb:/config
    depends_on:
      jitsi-prosody:
        condition: service_healthy
    mem_limit: ${MEM_LIMIT_JVB}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/about/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 45s
    logging: *default-logging

  jitsi-web:
    image: ${JITSI_IMAGE_WEB}
    container_name: exo-jitsi-web
    environment:
      # TLS é terminado pelo nginx do projeto (exo-web), que já tem o
      # certificado da CA interna. Aqui o Jitsi serve HTTP puro na rede
      # interna e NÃO tenta emitir certificado próprio nem redirecionar
      # para https — os dois quebrariam o proxy.
      DISABLE_HTTPS: 1
      ENABLE_HTTP_REDIRECT: 0
      # PUBLIC_URL precisa ser a URL que o NAVEGADOR usa. Se ficar errado,
      # o cliente monta o websocket de sinalização no host errado e a sala
      # nunca entra ("connecting..." eterno).
      PUBLIC_URL: ${JITSI_PUBLIC_URL}
      XMPP_DOMAIN: ${JITSI_XMPP_DOMAIN}
      XMPP_AUTH_DOMAIN: auth.${JITSI_XMPP_DOMAIN}
      XMPP_MUC_DOMAIN: muc.${JITSI_XMPP_DOMAIN}
      XMPP_INTERNAL_MUC_DOMAIN: internal-muc.${JITSI_XMPP_DOMAIN}
      XMPP_BOSH_URL_BASE: http://xmpp.meet.jitsi:5280
      # 2026-08-21 -- JWT do addon oficial eXo Jitsi (ver jitsi-prosody).
      ENABLE_AUTH: 1
      AUTH_TYPE: jwt
      JWT_APP_ID: ${JITSI_JWT_APP_ID}
      JWT_APP_SECRET: ${JITSI_JWT_APP_SECRET}
      JWT_ACCEPTED_ISSUERS: ${JITSI_JWT_APP_ID}
      JWT_ACCEPTED_AUDIENCES: ${JITSI_JWT_APP_ID}
      # ENABLE_GUESTS=1 (2026-08-21, correcao): com 0, SO' quem chega com JWT
      # do portal entra -- isso matou a REUNIAO/WEBINAR (criar sala e mandar o
      # link para as pessoas entrarem). Com 1, os dois casos convivem:
      #   - ligacao 1:1 pelo chat  -> JWT, entra direto, sem digitar nome
      #   - reuniao por link       -> convidado entra pela sala avulsa
      ENABLE_GUESTS: 1
      # Tela "Participar da reuniao" (prejoin): numa LIGACAO ela nao faz
      # sentido -- quem atende tem de cair direto na conversa, como no
      # celular. O JWT ja traz nome e autorizacao: nada a preencher.
      ENABLE_PREJOIN_PAGE: 0
      ENABLE_WELCOME_PAGE: 0
      TZ: ${TZ}
    volumes:
      - ./data/jitsi/web:/config
      # Fim de reuniao: a imagem oficial manda o usuario para a pagina de
      # despedida do proprio Jitsi (marca Jitsi, nada a ver com a
      # plataforma). Os tres arquivos de "close page" sao substituidos por
      # uma pagina da prefeitura que devolve o usuario ao portal.
      - ./conf/jitsi/close-redirect.html:/usr/share/jitsi-meet/static/close.html:ro
      - ./conf/jitsi/close-redirect.html:/usr/share/jitsi-meet/static/close2.html:ro
      - ./conf/jitsi/close-redirect.html:/usr/share/jitsi-meet/static/close3.html:ro
    depends_on:
      jitsi-prosody:
        condition: service_healthy
      jitsi-jicofo:
        condition: service_healthy
    mem_limit: ${MEM_LIMIT_JITSI_WEB}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/ -o /dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 30s
    logging: *default-logging


  # ---------------------------------------------------------------------------
  # jitsi-call -- microservico OFICIAL do addon eXo Jitsi (exoplatform/jitsi).
  #
  # Porque ele existe: o conector External Visio que a imagem community traz
  # apenas faz window.open(url). Nao ha chamada, nao ha toque, nao ha aviso do
  # outro lado -- medido: startCall() e' so' um window.open e o jar do
  # external-visio tem ZERO classes de notificacao. O addon oficial
  # (org.exoplatform.addons.jitsi:exo-jitsi:7.2.1) implementa chamada de
  # verdade, mas depende DESTE microservico, que assina os JWT das salas e
  # atende o callback de gravacao.
  #
  # Cadeia: navegador -> nginx -> jitsi-call (assina JWT) -> Jitsi Meet.
  # O eXo fala com ele via webconferencing.jitsi.url em exo.properties.
  # ---------------------------------------------------------------------------
  jitsi-call:
    image: ${JITSI_CALL_IMAGE}
    container_name: exo-jitsi-call
    environment:
      # URL do Jitsi Meet como o NAVEGADOR a alcanca (nao o nome interno):
      # e' ela que entra no token e no link da sala.
      PUBLIC_URL: ${JITSI_PUBLIC_URL}
      # Casa com webconferencing.jitsi.external.secret no exo.properties.
      # Se divergir, o portal fala com o microservico e leva 401.
      EXO_JWT_SECRET: ${JITSI_EXO_JWT_SECRET}
      # Casa com JWT_APP_SECRET/JWT_APP_ID do prosody. Se divergir, o token
      # da sala e' recusado pelo Jitsi e o usuario nunca entra.
      JWT_APP_SECRET: ${JITSI_JWT_APP_SECRET}
      JWT_APP_ID: ${JITSI_JWT_APP_ID}
      SIGNATURE_ALGORITHM: HS256
      EXO_FILE_UPLOAD_URL: ${EXO_PROXY_SCHEMA}://${EXO_PROXY_VHOST}/portal/rest/jitsi/upload
    mem_limit: ${MEM_LIMIT_JITSI_CALL}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null -w '%{http_code}' http://localhost/ | grep -qE '^(200|301|302|401|403|404)$$' || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 40s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # ClamAV — MOTOR de varredura do add-on exo-anti-malware
  #
  # POR QUE ESTE SERVICO EXISTE
  # ---------------------------
  # O exo-anti-malware 7.2.1 estava instalado SEM MOTOR NENHUM. Medido em
  # 2026-08-27 abrindo o proprio zip do add-on: seu
  # lib/anti-malware-services.jar!conf/portal/configuration.xml registra
  # apenas o conector TrendMicro (produto pago, e ainda por cima com
  # isDefault=false) e os conectores de item (files/jcr). O
  # ClamAVMalwareDetectionConnector existe no jar, mas como @Component do
  # Spring, e nao havia ClamAV algum nesta stack para alimenta-lo.
  # Resultado: o MalwareDetectionJob rodava a cada 5 min e nao escaneava nada.
  #
  # CONTRATO COM O ADD-ON (lido das constantes da classe, nao suposto)
  #   exo.malwareDetection.connector.clamav.report.path  arquivo que o eXo LE
  #   exo.malwareDetection.connector.clamav.isDefault    precisa ser true
  # O eXo le as linhas terminadas em "FOUND", parte no primeiro ":" e toma a
  # esquerda como caminho do arquivo infectado -- a saida crua do `clamscan`.
  #
  # POR ISSO O ALVO E' MONTADO NO MESMO CAMINHO DOS DOIS LADOS (/srv/exo/files):
  # o relatorio carrega caminhos ABSOLUTOS, e o eXo os resolve no proprio
  # sistema de arquivos. Montar em outro ponto aqui geraria caminhos que o
  # portal nao encontra, e nenhuma deteccao seria processada -- falha
  # silenciosa, que e' a pior especie.
  #
  # ALVO SOMENTE-LEITURA, DE PROPOSITO: o ClamAV nao precisa escrever nos
  # documentos do portal, e quem coloca em quarentena e' o eXo. `:ro` remove
  # a possibilidade de o scanner corromper o acervo. Quem escreve e' so' o
  # relatorio, em ./data/antimalware, volume separado.
  # ---------------------------------------------------------------------------
  clamav:
    image: ${CLAMAV_IMAGE}
    container_name: exo-clamav
    environment:
      TZ: ${TZ}
      CLAMAV_ALVO: /srv/exo/files
      CLAMAV_RELATORIO: /srv/antimalware/clamav-report.txt
      CLAMAV_JANELA: ${CLAMAV_JANELA}
      CLAMAV_NA_PARTIDA: ${CLAMAV_NA_PARTIDA}
      # A imagem oficial sobe clamd + freshclam + milter pelo entrypoint.
      # Aqui NADA disso sobe: o `command` abaixo substitui o entrypoint e
      # chama o freshclam pontualmente, so' antes de cada varredura. E' o que
      # mantem o custo permanente em ~50 MiB em vez de ~1,3 GiB residentes.
      CLAMAV_NO_CLAMD: "true"
      CLAMAV_NO_FRESHCLAMD: "true"
      CLAMAV_NO_MILTERD: "true"
    entrypoint: ["/bin/sh", "/opt/clamav-varredura.sh"]
    # A imagem sobe como root por padrao (medido: `id` -> uid=0). Um scanner
    # que abre 927 arquivos de origem externa nao tem por que ser root:
    # 1000:1000 e' o usuario `clamav` da propria imagem, dono de
    # /var/lib/clamav e ja' esperado pelo freshclam (DatabaseOwner clamav).
    user: "1000:1000"
    volumes:
      # Acervo do portal — SOMENTE LEITURA, no mesmo caminho que o eXo usa.
      - ./data/exo/files:/srv/exo/files:ro
      # Relatorio: unico ponto de escrita, compartilhado com o exo-app.
      - ./data/antimalware:/srv/antimalware:rw
      # Base de assinaturas persistida: sao ~300 MiB por download. Sem isto
      # cada restart do container baixa tudo de novo do mirror.
      - ./data/clamav:/var/lib/clamav:rw
      - ./scripts/clamav-varredura.sh:/opt/clamav-varredura.sh:ro
    # 1,3 GiB e' o pico real do clamscan carregando a base. O teto fica acima
    # disso para o OOM killer nao matar a varredura no meio, e ABAIXO do que
    # sobra no host para nao levar o portal junto.
    mem_limit: ${MEM_LIMIT_CLAMAV}
    healthcheck:
      # Saudavel = a base de assinaturas existe. Nao ha porta nem daemon para
      # sondar: entre janelas este container esta dormindo, de proposito.
      test: ["CMD-SHELL", "test -s /var/lib/clamav/daily.cvd -o -s /var/lib/clamav/daily.cld || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 20
      start_period: 600s
    logging: *default-logging

networks:
  default:
    name: exo_net
    # SEM ipam fixo, de proposito -- e ja' tentei o contrario.
    #
    # A interface da estrutura roda no HOST e o nginx (container) fala com ela
    # pelo GATEWAY desta rede. Seria comodo fixar 172.20.0.0/16 aqui para o
    # gateway ser sempre 172.20.0.1... so' que numa stack JA' EM PE isso muda a
    # definicao da rede, e o proximo 'docker compose up' tenta RECRIAR a rede:
    # ele para os containers, falha ao remover a rede em uso e deixa a stack
    # pela metade. Medido nesta maquina, com a stack de producao rodando.
    #
    # Portabilidade, entao, e' resolvida na instalacao e nao aqui:
    # scripts/instalar.sh LE o gateway real da rede
    # (docker network inspect exo_net) e escreve esse endereco nos dois lugares
    # que dependem dele -- a unidade systemd e o proxy_pass de conf/nginx.conf.
    # Funciona com qualquer faixa que o Docker sortear no servidor novo.

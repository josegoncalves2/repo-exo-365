# ===================================================================
# Traducao pt-BR da navegacao "Meu Espaco" — CORRECAO LOCAL
#
# Substitui o arquivo homonimo da imagem exo-community:7.2.1, que
# apresenta DOIS defeitos de origem (upstream):
#
#  1. A chave portal.myworkspace.notes NAO EXISTE em nenhum dos ~40
#     bundles de idioma da imagem, embora seja referenciada em
#     WEB-INF/conf/digital-workplace/portal/myworkspace/navigation.xml
#     como <label>#{portal.myworkspace.notes}</label>. Resultado: o
#     portal exibia o literal "#{portal.myworkspace.notes}" na barra
#     de navegacao.
#
#  2. O myworkspace_pt_BR.properties da imagem e uma COPIA do ingles
#     (dashboard=Dashboard, drive=Drive, tasks=Task, more=More), o que
#     deixava o menu em ingles mesmo com o locale pt/BR configurado.
#
# Acentos em escapes \uXXXX por seguranca com PropertyResourceBundle.
# ===================================================================
